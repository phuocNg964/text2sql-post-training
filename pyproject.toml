[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text2sql-post-training"
version = "0.1.0"
description = "Post-training pipeline for Text-to-SQL: Evaluation → SFT → Execution-based RL"
requires-python = ">=3.10"

dependencies = [
    # Core ML
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.44.0",
    # Data
    "datasets>=3.0.0",
    "sqlglot>=23.0.0",
    # Experiment tracking
    "wandb>=0.18.0",
    # Config & utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

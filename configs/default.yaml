# Inference and evaluation config
# Used by: scripts/run_inference.py, scripts/run_evaluation.py, scripts/smoke_test.py

model:
  name: "Qwen/Qwen2.5-Coder-3B-Instruct"   # M2 baseline decision: 3B model
  dtype: "bfloat16"
  load_in_4bit: true

data:
  spider_path: "data/spider_data"
  max_schema_tokens: 512   # truncate schema if too long

wandb:
  project: "text2sql-post-training"
  entity: null             # set to your W&B username or leave null for default

model:
  name: "Qwen/Qwen2.5-Coder-3B-Instruct"  # baseline model (no prior adapter)
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 3
  batch_size: 2
  grad_accum: 8               # effective batch = 16
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  optim: "adamw_8bit"
  seed: 42

data:
  train_path: "data/sft_targeted_train.jsonl"   # targeted curation
  eval_path:  "data/sft_eval.jsonl"             # 100 examples (stratified spider_dev)

output:
  dir: "checkpoints/sft_targeted"

wandb:
  project: "text2sql-post-training"
  name: "sft-qwen3b-targeted-r16"
  tags:
    - targeted
    - sft
    - semantic-retrieval
